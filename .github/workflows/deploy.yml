name: Validate and deploy store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-store
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:local

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare production configuration
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (!/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(id)) throw new Error('Set a valid D1 database ID.');
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) throw new Error('Set the Cloudflare account ID and API token.');
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases[0].database_id = id;
          writeFileSync('wrangler.jsonc', JSON.stringify(config));
          JS
      - run: npx wrangler d1 migrations apply DB --remote
      - name: Ensure the Cloudflare Workers subdomain exists
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/' +
            encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID) + '/workers/subdomain';
          const headers = {
            Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type': 'application/json',
          };
          async function request(options = {}) {
            const response = await fetch(endpoint, { headers, ...options, signal: AbortSignal.timeout(20000) });
            return response.json();
          }
          let state = await request();
          if (!state.success && state.errors?.some(error => error.code === 10007)) {
            state = await request({
              method: 'PUT',
              body: JSON.stringify({ subdomain: 'dorjster-tuya' }),
            });
          }
          const subdomain = state.result?.subdomain;
          if (!state.success || !/^[a-z0-9-]+$/.test(subdomain || '')) {
            const errors = state.errors?.map(error => error.code + ': ' + error.message).join(', ');
            throw new Error('Cloudflare Workers subdomain setup failed: ' + (errors || 'no subdomain returned'));
          }
          console.log('Cloudflare Workers subdomain: ' + subdomain + '.workers.dev');
          appendFileSync(process.env.GITHUB_ENV, 'WORKERS_ACCOUNT_SUBDOMAIN=' + subdomain + '\n');
          JS
      - name: Publish store
        env:
          STORE_ADMIN_PASSWORD: ${{ secrets.STORE_ADMIN_PASSWORD }}
        run: |
          umask 077
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          STORE_SECRET_FILE="$secret_file" node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const password = process.env.STORE_ADMIN_PASSWORD;
          if (!password || password.length < 16 || password.length > 256) throw new Error('Set STORE_ADMIN_PASSWORD to 16–256 characters.');
          writeFileSync(process.env.STORE_SECRET_FILE, JSON.stringify({ADMIN_PASSWORD: password}));
          JS
          npx wrangler deploy --secrets-file "$secret_file"
      - name: Verify the published store
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';

          const { name } = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          const base = 'https://' + name + '.' + process.env.WORKERS_ACCOUNT_SUBDOMAIN + '.workers.dev';

          async function verify() {
            const [home, products, signIn, inventory, storefront, samples] = await Promise.all([
              '/', '/api/products', '/api/admin/sign-in', '/api/admin/products', '/api/storefront', '/collection-samples.json',
            ].map(path => fetch(base + path, { signal: AbortSignal.timeout(12000) })));

            const markup = await home.text();
            if (!home.ok || !markup.includes('Tuya Brand') || !markup.includes('filter-dialog')) throw new Error('Storefront HTTP ' + home.status);
            if (!products.ok || !Array.isArray(await products.json())) throw new Error('Catalog HTTP ' + products.status);
            if (!signIn.ok || (await signIn.json()).passcode !== true) throw new Error('Admin PIN check failed');
            if (inventory.status !== 401) throw new Error('Admin inventory requires authentication');
            if (!storefront.ok || !(await storefront.json()).theme) throw new Error('Storefront settings HTTP ' + storefront.status);
            if (!samples.ok || new Set((await samples.json()).map(product => product.category)).size < 4) throw new Error('Sample catalog is missing its product types');
          }

          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              await verify();
              console.log('Verified storefront, catalog and admin protection at ' + base);
              break;
            } catch (error) {
              if (attempt === 7) throw error;
              console.log('Waiting for the public URL: ' + error.message);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
