name: Validate and deploy store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-store
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:local

  deploy:
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_D1_DATABASE_ID != ''
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare production configuration
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const id = process.env.CLOUDFLARE_D1_DATABASE_ID;
          if (!/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(id)) throw new Error('Set a valid D1 database ID.');
          if (!process.env.CLOUDFLARE_ACCOUNT_ID || !process.env.CLOUDFLARE_API_TOKEN) throw new Error('Set the Cloudflare account ID and API token.');
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases[0].database_id = id;
          writeFileSync('wrangler.jsonc', JSON.stringify(config));
          JS
      - run: npx wrangler d1 migrations apply DB --remote
      - name: Publish store
        env:
          STORE_ADMIN_PASSWORD: ${{ secrets.STORE_ADMIN_PASSWORD }}
        run: |
          umask 077
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"' EXIT
          STORE_SECRET_FILE="$secret_file" node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const password = process.env.STORE_ADMIN_PASSWORD;
          if (!password || password.length < 16 || password.length > 256) throw new Error('Set STORE_ADMIN_PASSWORD to 16–256 characters.');
          writeFileSync(process.env.STORE_SECRET_FILE, JSON.stringify({ADMIN_PASSWORD: password}));
          JS
          npx wrangler deploy --secrets-file "$secret_file"
