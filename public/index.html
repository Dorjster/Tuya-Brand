<!doctype html>
<html lang="mn" class="store-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121016">
  <meta name="description" content="Монгол үндэсний хувцас, хантаазны Tuya Brand цуглуулгыг үзээрэй.">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <link rel="stylesheet" href="/theme.css">
  <script src="/store.js" type="module"></script>
  <title>Tuya Brand — Онлайн дэлгүүр</title>
</head>
<body class="storefront" id="top">
  <a class="skip-link" href="#catalog">Барааны жагсаалт руу очих</a>
  <header class="site-header">
    <p id="store-announcement" class="store-announcement" hidden></p>
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="Tuya Brand нүүр хуудас"><img src="/images/tuya-logo-light.png" alt="Tuya Brand" width="750" height="173"></a>
      <nav aria-label="Үндсэн цэс"><a href="#catalog" id="nav-shop">Дэлгүүр</a><a href="#catalog" id="sale-link">Хямдрал</a></nav>
      <button id="bag-button" class="bag-button" type="button">Сагс <span id="bag-count">0</span></button>
    </div>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="hero-heading">
      <div class="hero-copy">
        <h1 id="hero-heading">Монгол үндэсний<br class="wide-only"> хувцас<span>.</span></h1>
        <p id="hero-description">Уламжлалт хийц, хээ угалзтай үндэсний хувцасны цуглуулга.</p>
        <a class="button primary hero-action" href="#catalog" id="shop-link">Цуглуулга үзэх</a>
      </div>
      <div class="hero-media">
        <picture>
          <source media="(max-width: 650px)" srcset="/images/hero-mobile.webp">
          <img src="/images/hero.webp" alt="Цагаан хээтэй улаан монгол хантаазны загвар зураг" fetchpriority="high">
        </picture>
      </div>
    </section>
    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <h2 id="catalog-title">Бүх бараа</h2>
      <div class="catalog-tools">
        <div class="catalog-head">
          <button id="open-filters" class="button filter-trigger" type="button"><span class="filter-icon" aria-hidden="true"></span><span id="filter-label">Шүүлтүүр</span></button>
          <label class="sorting"><span class="sr-only">Бараа эрэмбэлэх</span><select id="sort"><option value="new">Дэлгүүрийн эрэмбэ</option><option value="low">Үнэ өсөхөөр</option><option value="high">Үнэ буурахаар</option><option value="name">Нэрээр</option></select></label>
        </div>
        <div class="categories" id="categories" aria-label="Барааны ангилал"></div>
      </div>
      <p id="filter-summary" class="filter-summary" hidden></p>
      <p id="sample-notice" class="sample-notice" hidden>Энд жишээ загвар, жишээ үнэ харагдаж байна.</p>
      <p id="catalog-status" class="catalog-status" role="status">Бараа ачаалж байна…</p>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </main>
  <footer><div class="shell footer-inner"><a class="brand" href="/"><img src="/images/tuya-logo-light.png" alt="Tuya Brand" width="750" height="173"></a><div class="footer-contact"><span id="store-location">Улаанбаатар, Монгол</span><span id="store-contact" hidden></span></div></div></footer>
  <nav class="mobile-dock" aria-label="Утасны дэлгүүрийн цэс">
    <a href="#catalog" id="mobile-shop">Дэлгүүр</a>
    <a href="#catalog" id="mobile-sale">Хямдрал</a>
    <button type="button" id="mobile-filter">Шүүх<span id="mobile-filter-count" hidden></span></button>
    <button type="button" id="mobile-bag">Сагс <span id="mobile-bag-count">0</span></button>
  </nav>
  <a class="back-to-top" id="back-to-top" href="#top" aria-label="Хуудасны эхэнд очих" hidden>↑</a>
  <dialog id="filter-dialog" class="filter-dialog" aria-labelledby="filter-title">
    <div class="dialog-panel">
      <div class="dialog-head"><h2 id="filter-title">Бараа шүүх</h2><button type="button" id="close-filters" class="close-button" aria-label="Хаах">×</button></div>
      <form id="filter-form" class="fields">
        <label>Барааны төрөл<select name="type" id="filter-type"><option value="">Бүх төрөл</option></select></label>
        <div class="field-pair filter-price-fields">
          <label>Доод үнэ (₮)<input name="minPrice" type="number" inputmode="numeric" min="0" max="999999999" step="1"></label>
          <label>Дээд үнэ (₮)<input name="maxPrice" type="number" inputmode="numeric" min="0" max="999999999" step="1"></label>
        </div>
        <p id="filter-error" class="form-message" role="alert" hidden></p>
        <div class="filter-actions"><button id="reset-filters" class="button secondary" type="button">Арилгах</button><button class="button primary" type="submit">Үр дүнг харах</button></div>
      </form>
    </div>
  </dialog>
  <dialog id="product-dialog" class="product-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <dialog id="bag-dialog" class="bag-dialog" aria-labelledby="bag-title"><div id="bag-content"></div></dialog>
  <template id="card-template">
    <article class="product-card">
      <div class="product-frame"><button class="product-media" type="button"><img alt="" loading="lazy"><span class="no-image" hidden>Зураг удахгүй нэмэгдэнэ</span><span class="sale-badge" hidden>Хямдрал</span></button><button class="favorite-button" type="button" aria-label="Дуртай бараанд хадгалах">♡</button></div>
      <div class="product-info"><p class="product-category"></p><h3><button type="button"></button></h3>
      <div class="prices"><strong></strong><del hidden></del></div>
      <div class="product-bottom"><span class="stock-label"></span><button class="add-button" type="button">Сагсанд нэмэх</button></div></div>
    </article>
  </template>
  <p id="toast" class="toast" role="status" hidden></p>
</body>
</html>
